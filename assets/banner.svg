<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <!-- Soft Ambient Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Glow Orbs in Background */
    @keyframes pulseSlow {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(0px, 0px); }
      50% { opacity: 0.65; transform: scale(1.15) translate(20px, -15px); }
    }
    @keyframes pulseAlt {
      0%, 100% { opacity: 0.3; transform: scale(1.1) translate(0px, 0px); }
      50% { opacity: 0.6; transform: scale(0.95) translate(-25px, 20px); }
    }
    /* Flowing Laser Circuit Dash */
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    /* Subtle Floating Card Animation */
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .ambient-orb-1 {
      animation: pulseSlow 8s ease-in-out infinite;
      transform-origin: 200px 150px;
    }
    .ambient-orb-2 {
      animation: pulseAlt 10s ease-in-out infinite;
      transform-origin: 1000px 250px;
    }
    .circuit-beam {
      stroke-dasharray: 80 120;
      animation: circuitFlow 12s linear infinite;
    }
    .floating-card-1 {
      animation: cardFloat 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: cardFloat 7s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: cardFloat 5.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Background Orbs (Behind everything) -->
  <circle class="ambient-orb-1" cx="220" cy="120" r="150" fill="#0284c7" filter="url(#glowCyan)" />
  <circle class="ambient-orb-2" cx="1020" cy="220" r="160" fill="#7c3aed" filter="url(#glowPurple)" />
  <circle class="ambient-orb-1" cx="600" cy="350" r="130" fill="#4f46e5" filter="url(#glowPurple)" />

  <!-- Subtle Blueprint Tech Grid -->
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Animated Guardrail Flow Lines (Background circuits) -->
  <g fill="none" opacity="0.6">
    <path d="M 50 80 Q 300 20 600 80 T 1150 80" stroke="#334155" stroke-width="1.5" />
    <path class="circuit-beam" d="M 50 80 Q 300 20 600 80 T 1150 80" stroke="#38bdf8" stroke-width="2.5" />

    <path d="M 50 320 Q 300 380 600 320 T 1150 320" stroke="#334155" stroke-width="1.5" />
    <path class="circuit-beam" d="M 50 320 Q 300 380 600 320 T 1150 320" stroke="#a855f7" stroke-width="2.5" />
  </g>

  <!-- FOREGROUND: Header Brand & Title (Clean, crisp, unobstructed) -->
  <g transform="translate(80, 75)">
    <!-- Tagline Badge -->
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="20" class="tagline-text">Curated Guardrails &amp; Linting</text>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="75" class="title-text">Awesome Code Quality</text>
    <text x="495" y="75" class="title-text" fill="url(#accentGrad)">&amp; Guardrails</text>

    <!-- Subtitle -->
    <text x="0" y="118" class="subtitle-text">Static Analysis • Security Linting • AI Agent Safety • Quality Gates</text>
  </g>

  <!-- Interactive / Floating Category Dynamic Badges (Foreground Bottom) -->
  <g transform="translate(80, 245)">
    <!-- Pill 1: SAST & Security -->
    <g class="floating-card-1" transform="translate(0, 0)">
      <rect width="230" height="64" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" filter="url(#cardShadow)" />
      <!-- Shield Icon -->
      <g transform="translate(18, 18)" stroke="#38bdf8" stroke-width="2" fill="none">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="M9 12l2 2 4-4" />
      </g>
      <text x="56" y="29" class="badge-text" font-weight="700">SAST &amp; Security</text>
      <text x="56" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Semgrep • Snyk • Trivy</text>
    </g>

    <!-- Pill 2: Code Quality Gates -->
    <g class="floating-card-2" transform="translate(255, 0)">
      <rect width="250" height="64" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" filter="url(#cardShadow)" />
      <!-- Check/Quality Icon -->
      <g transform="translate(18, 18)" stroke="#818cf8" stroke-width="2" fill="none">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </g>
      <text x="56" y="29" class="badge-text" font-weight="700">Self-Hosted Gates</text>
      <text x="56" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">SonarQube • ESLint • Ruff</text>
    </g>

    <!-- Pill 3: AI Agent Guardrails -->
    <g class="floating-card-3" transform="translate(530, 0)">
      <rect width="260" height="64" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" filter="url(#cardShadow)" />
      <!-- AI / Sparkle Icon -->
      <g transform="translate(18, 18)" stroke="#c084fc" stroke-width="2" fill="none">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
      </g>
      <text x="56" y="29" class="badge-text" font-weight="700">AI Safety Guardrails</text>
      <text x="56" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">NeMo • Guardrails AI • OPA</text>
    </g>

    <!-- Pill 4: Secret & Compliance -->
    <g class="floating-card-1" transform="translate(815, 0)">
      <rect width="225" height="64" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" filter="url(#cardShadow)" />
      <!-- Key/Lock Icon -->
      <g transform="translate(18, 18)" stroke="#34d399" stroke-width="2" fill="none">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </g>
      <text x="56" y="29" class="badge-text" font-weight="700">Secret &amp; Policy Linting</text>
      <text x="56" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Gitleaks • ShellCheck</text>
    </g>
  </g>
</svg>
